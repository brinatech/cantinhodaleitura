default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "cantinhodaleitura_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_TEST_NAME", "cantinhodaleitura_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "cantinhodaleitura_production") %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_CACHE_NAME", "cantinhodaleitura_production_cache") %>
    url: <%= ENV["DATABASE_CACHE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_QUEUE_NAME", "cantinhodaleitura_production_queue") %>
    url: <%= ENV["DATABASE_QUEUE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_CABLE_NAME", "cantinhodaleitura_production_cable") %>
    url: <%= ENV["DATABASE_CABLE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
