production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # HU-20 (versão proposta): cadastros de menores não confirmados pelo responsável em 7 dias
  limpar_cadastros_menores_pendentes:
    class: LimparCadastrosMenoresPendentesJob
    schedule: every day at 3am
