databases:
  - name: cantinho-db
    databaseName: cantinhodaleitura
    user: cantinho
    plan: free
    region: ohio

services:
  - type: web
    name: cantinho-da-leitura
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cantinho-db
          property: connectionString
      - key: DATABASE_CACHE_URL
        fromDatabase:
          name: cantinho-db
          property: connectionString
      - key: DATABASE_QUEUE_URL
        fromDatabase:
          name: cantinho-db
          property: connectionString
      - key: DATABASE_CABLE_URL
        fromDatabase:
          name: cantinho-db
          property: connectionString
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SEED_INITIAL_CONTENT
        value: "true"
